<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect x="0" y="0" width="64" height="64" rx="12" fill="#2b2d42"/>
  
  <!-- Brush handle (rotated rectangle) -->
  <rect x="24" y="8" width="16" height="48" fill="#edf2f4" transform="rotate(45 24 8)"/>
  
  <!-- Brush tip -->
  <rect x="32" y="0" width="8" height="16" fill="#ef233c" transform="rotate(45 32 0)"/>
  
  <!-- Color dots -->
  <circle cx="16" cy="16" r="4" fill="#ef233c"/>
  <circle cx="24" cy="12" r="4" fill="#ffd166"/>
  <circle cx="20" cy="20" r="4" fill="#06d6a0"/>
</svg>
